<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arch Madness</title>
  <script>localStorage.removeItem("arcboard_mode");</script>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      background: #f3f6f8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #20242a;
      letter-spacing: 0.01em;
    }

    nav {
      display: flex;
      flex-direction: row;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-decoration: none;
      color: #20242a;
      border: 1px solid #d5dbe3;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(40, 54, 70, 0.1);
      padding: 14px 14px 0;
      transition: 140ms ease;
      transition-property: box-shadow, transform, border-color;
    }

    nav a:hover {
      border-color: #1f6f8b;
      box-shadow: 0 8px 28px rgba(31, 111, 139, 0.18);
      transform: translateY(-2px);
    }

    nav a:active {
      transform: translateY(0);
    }

    nav a img {
      width: 250px;
      height: 250px;
      display: block;
      border-radius: 2px;
    }

    .label {
      width: 100%;
      padding: 10px 0 12px;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 680;
      color: #20242a;
    }

    .corner {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .tk-link {
      color: #20242a;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .tk-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
    .corner {
      left: 0;
      bottom: 60%;
      flex-direction: row-reverse;
      align-items: flex-start;
      gap: 4px;
      white-space: nowrap;
      transform: rotate(90deg) translateX(-10%);
      transform-origin: bottom left;
    }

    /* nudge only the js line up — more negative pushes it further from tk */
    .corner .js {
      transform: translateX(-10em);
    }
  }
  </style>
</head>
<body>
  <h1>Arch Madness!</h1>
  <nav>
    <a href="rules.html">
      <img src="https://www.janestreet.com/assets/page-bg-img-culture-5e727cd10237b7b9c422d7fd7a195208cca29e200931efe5f9a68ba0a84abde9.svg" alt="Rules">
      <span class="label">Rules</span>
    </a>
    <a href="tutorial.html">
      <img src="media/tutorialbox.png" alt="Tutorial">
      <span class="label">Tutorial</span>
    </a>
    <a href="arch_madness.html">
      <img src="media/puzzlebox.png" alt="Puzzle">
      <span class="label">Puzzle</span>
    </a>
  </nav>
  <div class="corner">
    <a class="tk-link" href="https://github.com/tksoftw" target="_blank">made with 💗 by tk</a>
    <a class="tk-link js" href="https://www.janestreet.com/puzzles/arch-madness-index/" target="_blank">original puzzle by jane street</a>
  </div>
</body>
</html>
